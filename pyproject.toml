[project]
name = "keepalive-mcp"
version = "0.1.0"
description = "Persistent, audited SSH connection pool for managed network devices."
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.30.0",
    "cryptography==50.0.0",
    "httpx==0.28.1",
    "mcp==1.28.1",
    "ntc-templates==7.9.0",
    "PyJWT==2.13.0",
    "PyYAML==6.0.2",
    "scrapli[asyncssh]==2025.1.30",
    "scrapli-community==2025.1.30",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["server", "migrate"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
py-modules = ["server", "migrate"]
